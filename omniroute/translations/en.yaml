configuration:
  initial_password:
    name: Initial Password
    description: >-
      Admin password for the OmniRoute dashboard. Set this before first login.
      You can change it later from Dashboard > Settings > Security.
  require_api_key:
    name: Require API Key
    description: >-
      When enabled, all /v1/* proxy requests must include a valid API key.
      You can create API keys from the OmniRoute dashboard after first login.
  auth_cookie_secure:
    name: Secure Cookies
    description: >-
      Set the Secure flag on session cookies. Enable this when running
      behind HTTPS (recommended for remote access).
