name: "Securo"
description: >-
  Self-hosted personal finance manager. Multi-account tracking,
  transaction imports, bank sync, budgets, goals, and reports.
version: "0.26.1"
image: ghcr.io/yianniscy84/haos-securo
slug: "securo"
init: false
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ports:
  80/tcp: 80
ports_description:
  80/tcp: "Securo web interface"
host_network: false
map:
  - type: share
    read_only: false
apparmor: true
webui: "http://[HOST]:[PORT:80]/"
ingress: true
ingress_port: 80
ingress_entry: /
panel_icon: mdi:wallet
panel_title: "Securo"
backup: hot
stage: stable

options:
  secret_key: ""
  frontend_url: ""
  debug: false
  db_password: "postgres"
  pluggy_client_id: ""
  pluggy_client_secret: ""
  enable_banking_app_id: ""
  enable_banking_private_key_file: ""
  enable_banking_oauth_redirect_uri: ""
  simplefin_enabled: false
  simplefin_api_url: "https://beta-bridge.simplefin.org"
  oidc_enabled: false
  oidc_provider_name: "OIDC"
  oidc_discovery_url: ""
  oidc_client_id: ""
  oidc_client_secret: ""
  oidc_redirect_uri: ""
  oidc_scopes: "openid email profile"
  oidc_auto_register: true
  oidc_existing_user_link_mode: "disabled"
  oidc_require_verified_email: true
  oidc_sync_roles: false
  oidc_roles_claim: "groups"
  oidc_admin_roles: ""
  oidc_workspace_role_map: ""
  local_auth_enabled: true
  openexchangerates_app_id: ""
  fx_sync_mode: "on_demand"
  tesouro_direto_enabled: true

schema:
  secret_key: str
  frontend_url: str
  debug: bool
  db_password: str
  pluggy_client_id: str
  pluggy_client_secret: str
  enable_banking_app_id: str
  enable_banking_private_key_file: str
  enable_banking_oauth_redirect_uri: str
  simplefin_enabled: bool
  simplefin_api_url: str
  oidc_enabled: bool
  oidc_provider_name: str
  oidc_discovery_url: str
  oidc_client_id: str
  oidc_client_secret: str
  oidc_redirect_uri: str
  oidc_scopes: str
  oidc_auto_register: bool
  oidc_existing_user_link_mode: list(disabled|verified_email|email)
  oidc_require_verified_email: bool
  oidc_sync_roles: bool
  oidc_roles_claim: str
  oidc_admin_roles: str
  oidc_workspace_role_map: str
  local_auth_enabled: bool
  openexchangerates_app_id: str
  fx_sync_mode: str
  tesouro_direto_enabled: bool
