name: "OmniRoute Test"
description: >-
  Free AI gateway (TEST). One endpoint, 350+ providers, 1200+ models.
  This is a pre-release/test version — tracks the upstream release branch.
  Configure providers, API keys, and routing through the dashboard after install.
version: "0.1.0"
slug: "omniroute-test"
init: false
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
ports:
  20128/tcp: 20129
ports_description:
  20128/tcp: "OmniRoute Test dashboard and API"
host_network: false
map:
  - type: share
    read_only: false
apparmor: true
webui: "http://[HOST]:[PORT:20128]/"
ingress: true
ingress_port: 80
ingress_entry: /
panel_icon: mdi:route
panel_title: "OmniRoute Test"
backup: hot
stage: stable

options:
  initial_password: ""
  require_api_key: false
  auth_cookie_secure: false

schema:
  initial_password: password
  require_api_key: bool
  auth_cookie_secure: bool
