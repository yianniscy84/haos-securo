name: "VERT Test"
description: >-
  Open-source file converter (TEST). Converts images, audio, documents via
  WebAssembly and video via the vertd daemon. This is a pre-release/test version.
version: "0.1.1"
slug: "vert-test"
init: false
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ports:
  3000/tcp: 3001
ports_description:
  3000/tcp: "VERT Test web interface"
host_network: false
map:
  - type: share
    read_only: false
apparmor: true
ingress: true
ingress_port: 80
ingress_entry: /
panel_icon: mdi:file-replace
panel_title: "VERT Test"
backup: hot
stage: stable

options:
  vertd_enabled: true
  vertd_port: 24153

schema:
  vertd_enabled: bool
  vertd_port: int
